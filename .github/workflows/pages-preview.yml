name: Pages preview

on:
  workflow_run:
    workflows:
      - Web Pages preview build
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  identity:
    name: Resolve trusted preview identity
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.identity.outputs.branch }}
      head_sha: ${{ steps.identity.outputs.head_sha }}
      pull_number: ${{ steps.identity.outputs.pull_number }}
    steps:
      - name: Resolve exact internal pull request
        id: identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runId = context.payload.workflow_run.id
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            })
            if (run.name !== 'Web Pages preview build' || run.path !== '.github/workflows/pages-preview-build.yml') {
              core.setFailed('Preview must be orchestrated by the trusted Web Pages preview build workflow.')
              return
            }
            if (run.conclusion !== 'success' || run.event !== 'pull_request') {
              core.setFailed('Preview delivery requires a successful pull-request check run.')
              return
            }
            if (run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork pull requests are not eligible for preview credentials.')
              return
            }

            const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: run.head_sha,
            })
            const pull = pulls.data.find((candidate) =>
              candidate.state === 'open' &&
              candidate.base.ref === 'main' &&
              candidate.base.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
              run.pull_requests.some((item) => item.number === candidate.number) &&
              candidate.head.sha === run.head_sha &&
              candidate.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
            )
            if (!pull) {
              core.setFailed('Run is not the exact head of an eligible internal pull request.')
              return
            }

            core.setOutput('branch', `preview/client-web/pr-${pull.number}`)
            core.setOutput('head_sha', run.head_sha)
            core.setOutput('pull_number', String(pull.number))

  deploy:
    name: Deploy pull-request preview
    needs: identity
    concurrency:
      group: pages-preview-client-web-${{ needs.identity.outputs.pull_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      deployments: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: preview
      url: ${{ steps.pages.outputs.pages-deployment-alias-url }}
    steps:
      - name: Checkout the trusted preview controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: controller
          persist-credentials: false

      - name: Set up trusted Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: controller/package.json

      - name: Prepare isolated delivery tool directory
        run: mkdir --parents "$RUNNER_TEMP/pages-preview-tool"

      - name: Download the triggering run exact-head artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: pages-preview-${{ needs.identity.outputs.head_sha }}
          path: ${{ runner.temp }}/pages-preview-artifact

      - name: Validate static preview files
        env:
          PREVIEW_DIST: ${{ runner.temp }}/pages-preview-artifact
        run: |
          python3 - <<'PYCODE'
          import os
          import stat
          from pathlib import Path
          root = Path(os.environ['PREVIEW_DIST'])
          for directory, dirs, files in os.walk(root, followlinks=False):
              for name in dirs + files:
                  path = Path(directory) / name
                  mode = path.lstat().st_mode
                  if stat.S_ISLNK(mode) or not (stat.S_ISDIR(mode) or stat.S_ISREG(mode)):
                      raise SystemExit(f'Unsupported static artifact entry: {path}')
                  if name == '_worker.js':
                      raise SystemExit(f'Pages Worker code is forbidden: {path}')
          if not (root / 'index.html').is_file():
              raise SystemExit('Static preview requires index.html')
          PYCODE

      - name: Bind Module Federation assets to the selected snapshot
        env:
          INKCRE_PREVIEW_SOURCE_SHA: ${{ needs.identity.outputs.head_sha }}
        run: node controller/scripts/prepare-pages-preview.mjs "$RUNNER_TEMP/pages-preview-artifact"

      - name: Reverify the current pull request before delivery
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PREVIEW_PULL_NUMBER: ${{ needs.identity.outputs.pull_number }}
          PREVIEW_HEAD_SHA: ${{ needs.identity.outputs.head_sha }}
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PREVIEW_PULL_NUMBER),
            })
            const repository = `${context.repo.owner}/${context.repo.repo}`
            if (pull.state !== 'open' || pull.head.sha !== process.env.PREVIEW_HEAD_SHA ||
                pull.base.ref !== 'main' || pull.base.repo.full_name !== repository ||
                pull.head.repo?.full_name !== repository) {
              core.setFailed('The current PR no longer matches the exact-head preview build.')
            }

      - name: Deploy to the isolated Pages preview branch
        id: pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: 4.114.0
          workingDirectory: ${{ runner.temp }}/pages-preview-tool
          command: >-
            pages deploy ${{ runner.temp }}/pages-preview-artifact
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ needs.identity.outputs.branch }}
            --commit-hash=${{ needs.identity.outputs.head_sha }}
            --commit-dirty=false

      - name: Report preview links
        run: node controller/scripts/report-pages-preview.mjs
        env:
          INKCRE_PREVIEW_URL: ${{ steps.pages.outputs.pages-deployment-alias-url }}
          INKCRE_PREVIEW_DEPLOYMENT_URL: ${{ steps.pages.outputs.deployment-url }}
          INKCRE_PREVIEW_SOURCE_SHA: ${{ needs.identity.outputs.head_sha }}

name: App checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: >-
    app-checks-${{
      github.event.pull_request.number ||
      github.ref
    }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: GitHub Actions syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache: false

      - name: Validate GitHub Actions definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  core-release:
    name: Resolve admitted Core release
    runs-on: ubuntu-latest
    outputs:
      contract_revision: ${{ steps.release.outputs.contract_revision }}
      image: ${{ steps.release.outputs.image }}
      schema_digest: ${{ steps.release.outputs.schema_digest }}
      source_revision: ${{ steps.release.outputs.source_revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Authenticate to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify canonical candidate admission boundaries
        run: node --test scripts/test-core-release.mjs

      - name: Resolve admitted Core once to an immutable release
        id: release
        run: node scripts/resolve-core-release.mjs

      - name: Record upstream release selection
        env:
          CONTRACT_REVISION: ${{ steps.release.outputs.contract_revision }}
          CORE_IMAGE: ${{ steps.release.outputs.image }}
          SCHEMA_DIGEST: ${{ steps.release.outputs.schema_digest }}
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
        run: |
          {
            echo '## Selected core service release'
            echo
            echo "- Image: \`$CORE_IMAGE\`"
            echo "- Source: \`$SOURCE_REVISION\`"
            echo "- Schema: \`$SCHEMA_DIGEST\`"
            echo "- Runtime contract: \`$CONTRACT_REVISION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  workspace:
    name: Workspace contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile

      - name: 校验源代码格式、静态规则和类型
        run: pnpm format:check && pnpm lint && pnpm type-check

      - name: 读取待处理的版本计划
        id: build-versions
        run: |
          git show-ref --verify --quiet refs/heads/main || git branch main HEAD
          pnpm exec changeset status --output "$RUNNER_TEMP/build-versions.json"
          node -e 'console.log("needed=" + (require(process.argv[1]).releases.length > 0))' "$RUNNER_TEMP/build-versions.json" >> "$GITHUB_OUTPUT"

      - name: 在临时 checkout 中准备兼容构建版本
        if: steps.build-versions.outputs.needed == 'true'
        run: |
          pnpm release:version
          pnpm install --lockfile-only --ignore-scripts

      - name: 构建并校验相互兼容的 Host 与 MF 产物
        run: pnpm build

      - name: Verify independent SDK and Job observations
        run: pnpm check:sdk && pnpm check:web

      - name: 验证 B 站收藏采集规则
        run: pnpm --filter @inkcre/ext-bilibili test

      - name: Verify independent MF publication
        run: >-
          node --test scripts/test-extension-publication.mjs scripts/test-core-sdk-publication.mjs
          scripts/tests/independent-extension-release.test.mjs
          scripts/tests/release-checkout.test.mjs
          scripts/tests/core-sdk-compatibility.test.mjs
          scripts/tests/pages-preview.test.mjs
          scripts/tests/browser-automation-transport.test.mjs
          scripts/tests/job-cancellation.test.mjs
          scripts/tests/source-anchor.test.mjs

  peer-database:
    # Existing branch protection binds this exact check name.
    name: client-web E2E
    needs: core-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Install the exact browser engine
        run: pnpm exec playwright install --with-deps chromium

      - name: Authenticate to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the selected real core service and isolated browser/database chain
        run: pnpm test:e2e:web
        env:
          INKCRE_CORE_IMAGE: ${{ needs.core-release.outputs.image }}

      - name: Upload browser and database evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peer-database-failure-evidence
          path: |
            test-results/playwright
            test-results/database
          if-no-files-found: ignore
          retention-days: 7

  browser-extension:
    # Existing branch protection binds this exact check name.
    name: client-webext E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned pnpm release
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Install the exact browser engine
        run: pnpm exec playwright install --with-deps chromium

      - name: Load the exact Chromium extension build
        run: pnpm test:e2e:webext

      - name: Build the Firefox extension
        run: pnpm --filter @inkcre/webext build:firefox

      - name: Verify WebExt delivery rules
        run: node --test scripts/tests/webext-release.test.mjs

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-extension-failure-evidence
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7
